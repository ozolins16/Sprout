{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Dashboard" %} — {{ business.name }}{% endblock %}

{% block content %}
<section class="dashboard">
    <h1>{{ business.name }}</h1>
    <p class="muted">{{ business.get_category_display }}</p>

    <ul class="dashboard-links">
        <li><a class="button" href="{% url 'businesses:service_list' %}">{% trans "Manage services" %}</a></li>
        <li><a class="button" href="{% url 'businesses:staff_list' %}">{% trans "Manage staff" %}</a></li>
    </ul>
</section>
{% endblock %}
